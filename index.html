<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tokonoma · كتاب التحدي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1b1412;--page:#F2EADB;--page2:#E9DEC8;--ink:#2b2b2b;--gray:#6b6b6b;--red:#C8281E;--green:#2f7d4f;--gold:#c9a24a;--line:#d9cdb6;--cover:#6e1a15}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(circle at 50% 0%,#2c211d,var(--bg));color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:18px 14px 40px}
  main{width:100%;max-width:470px}
  .brand{text-align:center;color:var(--gold);font-family:ui-monospace,Menlo,monospace;letter-spacing:.3em;font-size:.75rem;margin-bottom:12px;direction:ltr}
  .book{position:relative;background:var(--cover);border-radius:10px 18px 18px 10px;padding:10px 10px 10px 14px;box-shadow:0 18px 40px #000a,inset 0 0 0 2px #00000040,inset 0 0 0 4px #c9a24a55;perspective:1400px}
  .book::before{content:"";position:absolute;right:0;top:8px;bottom:8px;width:10px;background:linear-gradient(90deg,#0004,#0000);border-radius:0 10px 10px 0;pointer-events:none}
  #page{background:linear-gradient(90deg,var(--page2),var(--page) 14%,var(--page));border-radius:6px 12px 12px 6px;padding:20px 18px 22px;min-height:440px;transform-origin:right center;position:relative;box-shadow:inset 8px 0 14px -8px #0003}
  #page.out{transform:rotateY(78deg);opacity:.25;transition:transform .42s ease,opacity .42s ease}
  #page.in{animation:turnIn .45s ease}
  @keyframes turnIn{from{transform:rotateY(-70deg);opacity:.3}to{transform:none;opacity:1}}
  h1,h2{font-family:'Amiri',serif;margin:.2em 0;text-align:center}
  h1{font-size:2rem}h2{font-size:1.5rem}
  .sigil{width:92px;height:92px;margin:6px auto 4px;display:block}
  .sub{text-align:center;color:var(--gray);font-size:.92rem;margin:0 0 12px}
  .rules{list-style:none;margin:10px 0 16px;padding:0;font-size:.92rem}
  .rules li{padding:7px 0;border-top:1px dashed var(--line)}
  .btn{display:block;width:100%;padding:13px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--page);font:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:8px;text-align:center;text-decoration:none}
  .btn.alt{background:transparent;color:var(--ink)}
  .mono{font-family:ui-monospace,Menlo,monospace;color:var(--red);direction:ltr;display:inline-block}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--gray);margin-bottom:8px}
  .lvl{font-family:'Amiri',serif;font-size:1.25rem;color:var(--ink)}
  .dots{display:flex;gap:4px;direction:rtl;margin-bottom:10px}
  .dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .dots i.done{background:var(--green)}.dots i.cur{background:var(--red)}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
  .bar b{display:block;height:100%;width:100%;background:var(--green);transition:width .1s linear,background .3s}
  .bar.low b{background:var(--red)}
  .tag{display:inline-block;font-size:.78rem;padding:2px 10px;border:1px solid var(--red);color:var(--red);border-radius:99px;margin-bottom:8px}
  .q{font-family:'Amiri',serif;font-size:1.3rem;line-height:1.7;margin:4px 0 14px}
  .opt{display:block;width:100%;text-align:right;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:#fffaf0;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
  .opt:active{background:#f4e8d0}
  .opt.dead{opacity:.35;text-decoration:line-through;pointer-events:none;border-color:var(--red)}
  .msg{min-height:1.5em;text-align:center;font-size:.9rem;color:var(--red);margin-top:8px}
  .code{display:block;text-align:center;margin:10px auto;padding:9px 16px;border:1.5px dashed var(--red);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;color:var(--red);letter-spacing:.12em;direction:ltr;width:fit-content}
  .stats{display:flex;justify-content:center;gap:24px;margin:10px 0;color:var(--gray);font-size:.85rem;text-align:center}
  .stats b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;color:var(--red);direction:ltr}
  .small{font-size:.8rem;color:var(--gray);text-align:center;margin-top:10px}
  footer{text-align:center;margin-top:14px;font-size:.82rem;color:#b9a98f}
  footer a{color:var(--gold);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="brand">TOKONOMA · GRIMOIRE</div>
  <div class="book"><div id="page"></div></div>
  <footer>من <a href="https://tokonomastore.com" target="_blank" rel="noopener">tokonomastore.com</a></footer>
</main>

<script>
/* ============ إعدادات سهلة التعديل ============ */
const REWARD_CODE = "TOKO10";
const REWARD_TEXT = "خصم 10% على أي طلب من المتجر";
const SITE = "tokonomastore.com";
const T = [30,28,26,24,22,22,20,20,18,18];   // ثواني كل مستوى
const LIMIT = 360;                            // الوقت الكلي بالثواني (6 دقائق)
const PENALTY = 8;                            // عقوبة الخطأ في المستويات 1-5 (ثواني)

/* ============ بنك الأسئلة ============
   p=1 سهل (مستويات 1-3) | p=2 متوسط (4-6) | p=3 صعب (7-8) | p=4 معارك (9-10)
   الصيغة: [الدرجة, السؤال, الجواب الصحيح, [3 إجابات خاطئة]] */
const BANK = [
 // ---- سهل ----
 [1,"من هو بطل أنمي ناروتو؟","ناروتو أوزوماكي",["ساسكي أوتشيها","كاكاشي هاتاكي","روك لي"]],
 [1,"ما اسم سفينة طاقم القبعة القشية الأولى في ون بيس؟","غوينغ ميري",["ثاوزند صني","ريد فورس","موبي ديك"]],
 [1,"بماذا يتطور بيكاتشو باستخدام حجر الرعد؟","رايتشو",["بيتشو","رايتشو ألولا","بيكا-كوين"]],
 [1,"ما اسم شقيقة تانجيرو التي تحولت إلى شيطانة؟","نيزوكو",["مايتسوري","شينوبو","كانا"]],
 [1,"ما اسم بطل أنمي هجوم العمالقة؟","إيرين ييغر",["أرمين أرلرت","ليفاي أكرمان","جان كيرشتاين"]],
 [1,"من هو البطل الأصلع الذي يهزم أي عدو بضربة واحدة؟","سايتاما",["غينوس","ميومي","غاروو"]],
 [1,"ما اسم الطفلة التي تقرأ الأفكار في أنمي سباي × فاميلي؟","آنيا",["يور","بوند","كيلي"]],
 [1,"ما اسم الأخوين الكيميائيين في فولميتال ألكيميست؟","إدوارد وألفونس",["روي وريزا","ليو وإيريك","إدوارد وهوهنهايم"]],
 [1,"من ورث قوة ون فور أول من أول مايت؟","إيزوكو ميدوريا",["كاتسوكي باكوغو","شوتو تودوروكي","تينيا إيدا"]],
 [1,"كم سيفاً يستخدم زورو في أسلوبه القتالي الشهير؟","ثلاثة",["اثنان","أربعة","سيف واحد"]],
 [1,"من هو قبطان قراصنة الشعر الأحمر؟","شانكس",["باغي","كايدو","روجر"]],
 [1,"من هو معلم الفريق 7 في ناروتو؟","كاكاشي هاتاكي",["جيرايا","إيروكا","غاي"]],
 [1,"من هو بطل أنمي دكتور ستون الذي يعيد بناء الحضارة بالعلم؟","سنكو إيشيغامي",["تايجو أورا","جينرو","كوهاكو"]],
 [1,"من هو معلم سانجي الذي علّمه الطبخ؟","زيف",["باراتي","كوبي","غين"]],
 // ---- متوسط ----
 [2,"من هو آخر ناجٍ من قبيلة الكورتا في هانتر × هانتر؟","كورابيكا",["ليوريو","كيلوا","هيسوكا"]],
 [2,"ما اسم القانون الأساسي للكيمياء في فولميتال ألكيميست؟","التبادل المتكافئ",["القوة المطلقة","الخلق من العدم","توازن الأرواح"]],
 [2,"ما اسم الفرقة التي تستكشف خارج الأسوار في هجوم العمالقة؟","فيلق الاستطلاع",["الشرطة العسكرية","فيلق الحامية","فيلق التدريب"]],
 [2,"إلى أي فرقة فرسان ينتمي آستا في بلاك كلوفر؟","الثيران السوداء",["الأسود الذهبية","الصقور الزرقاء","الورود الزرقاء"]],
 [2,"كم عدد الوحوش ذات الذيول في عالم ناروتو؟","تسعة",["سبعة","عشرة","ثمانية"]],
 [2,"ما اسم عيون عائلة أوتشيها الخاصة؟","الشارينغان",["البياكوغان","الريناغان","التينسيغان"]],
 [2,"ما اسم توسيع النطاق الخاص بغوجو في جوجتسو كايسن؟","الفراغ اللامحدود",["الضريح الخبيث","الحديقة المتناغمة","المجال اللانهائي"]],
 [2,"ما اسم أقوى شيطان وأول من أنشأ الشياطين في قاتل الشياطين؟","موزان كيبوتسوجي",["دوما","أكازا","كوكوشيبو"]],
 [2,"ما اسم شخصية دفتر الموت البشرية التي استخدمته؟","لايت ياغامي",["ريوك","ميلو","نير"]],
 [2,"ما الذي حوّل البشر إلى حجر في دكتور ستون؟","وميض ضوء غامض",["وباء قاتل","غاز بركاني","سحر شرير"]],
 [2,"ما اسم زعيم الثيران السوداء في بلاك كلوفر؟","يامي سوكيرو",["جاك الجزّار","ويليام فانغارد","نوزل سيلفا"]],
 [2,"ما اسم عالم لعبة الواقع الافتراضي في سورد آرت أونلاين؟","أينكراد",["ألفهايم","غغو","أندرفرد"]],
 // ---- صعب (فخاخ) ----
 [3,"ما الاسم الحقيقي لفاكهة لوفي التي كُشف عنها لاحقاً؟","هيتو هيتو نو مي موديل: نيكا",["غومو غومو نو مي موديل: ثور","موشا موشا نو مي","غيرا غيرا نو مي"]],
 [3,"ما اسم نظام القوة في أنمي هانتر × هانتر؟","نين",["تشاكرا","كي","هاكي"]],
 [3,"ما الثمن الذي دفعه ألفونس بعد محاولة إحياء والدته؟","جسده كاملاً",["ذراعه فقط","بصره","ذاكرته"]],
 [3,"كم عدد أعضاء الأقمار العليا في قاتل الشياطين؟","ستة",["اثنا عشر","ثلاثة","تسعة"]],
 [3,"ما اسم سيف زورو الأبيض الذي ورثه من صديقته كويينا؟","وادو إيتشيمونجي",["سان داي كيتيتسو","شوسوي","إنما"]],
 [3,"ما اسم نطاق سوكونا في جوجتسو كايسن؟","الضريح الخبيث",["الفراغ اللامحدود","النطاق الدامي","الحديقة المتناغمة"]],
 [3,"ما اسم البانكاي الأول لإيشيغو في بليتش؟","تنسا زانغيتسو",["هوغيوكو","غرينديل","سينبونزاكورا"]],
 [3,"ما اسم الأب الذي حقن إيرين بالمصل في هجوم العمالقة؟","غريشا ييغر",["زيك ييغر","كروغر","ديفيد"]],
 [3,"ماذا يقدّم الشينيغامي مقابل «عيون الشينيغامي» في مذكرة الموت؟","نصف عمره المتبقي",["ذاكرته","اسمه","قدرته على الكتابة"]],
 // ---- معارك ----
 [4,"كيف انتهت المعركة الأخيرة بين ناروتو وساسكي في وادي النهاية؟","فقد كلٌّ منهما ذراعاً وانتهت بالتعادل",["قتل ناروتو ساسكي","هرب ساسكي","قتل ساسكي ناروتو"]],
 [4,"من الشيطان الذي قتل كيوجورو رينغوكو في قطار اللامحدود؟","أكازا",["دوما","رومي","غيوتارو"]],
 [4,"من انتصر في معركة شينجوكو بين غوجو وسوكونا؟","سوكونا",["غوجو","يوجي","لم تُحسم"]],
 [4,"ما التحول الذي ظهر لأول مرة في معركة غوكو ضد فريزا؟","سوبر ساياجين",["سوبر ساياجين 3","الغريزة الفائقة","سوبر ساياجين بلو"]],
 [4,"من حسم المعركة ضد سيل بكاميهاميها مشتركة مع والده؟","غوهان",["فيجيتا","تيرونكس","غوتين"]],
 [4,"ما الضربة التي أنهى بها أول مايت معركته الحاسمة ضد أول فور وان؟","يونايتد ستيتس أوف سماش",["ديترويت سماش","شوت ستايل","غان سماش"]],
 [4,"من هزم زورو في أول مواجهة بينهما ببارتي؟","ميهوك",["كروغر","أرلونغ","لوتشي"]],
 [4,"من الذي هزم آس وأسره في ون بيس؟","باربا السوداء",["أكاينو","باغي","كروكودايل"]],
 [4,"ما نقطة الضعف الكبرى لقوة كروكودايل الرملية؟","الماء",["النار","الرياح","الجليد"]],
 [4,"ما سلاح نيترو الذي أضعف به ميروم في معركتهما؟","قنبلة سامة",["سيف الهاكي","تقنية الجاجنكن","الضربة الأخيرة بالنين المقدس"]],
 [4,"كيف انتهت حياة إل في مذكرة الموت؟","كتبت ريم اسمه في الدفتر",["كتب لايت اسمه","انتحر","قتله ميلو"]],
 [4,"ما الذي أنهى حياة إيتاتشي بعد معركته مع ساسكي؟","مرضه",["قتله ساسكي","قتله مادارا","انتحر"]],
];
const P = BANK.map((r,i)=>({id:i,p:r[0],q:r[1],a:r[2],w:r[3]}));

/* ============ أدوات ============ */
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const poolOf=lv=>lv<3?1:lv<6?2:lv<8?3:4;
const SIGIL='<svg class="sigil" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#6e1a15" stroke-width="2"/><circle cx="50" cy="50" r="38" fill="none" stroke="#c9a24a" stroke-width="1.5"/><path d="M50 8 L56 44 L92 50 L56 56 L50 92 L44 56 L8 50 L44 44 Z" fill="none" stroke="#6e1a15" stroke-width="1.5"/><text x="50" y="62" text-anchor="middle" font-size="34" font-family="serif" fill="#C8281E">床</text></svg>';

/* ============ الحالة ============ */
let S=null, tick=null;
let rec=store.get("toko_rec")||{wins:0,best:0};

function pickQ(lv){
  const pool=poolOf(lv);
  let c=P.filter(x=>x.p===pool&&!S.used[x.id]);
  if(!c.length){P.filter(x=>x.p===pool).forEach(x=>delete S.used[x.id]);c=P.filter(x=>x.p===pool);}
  const q=c[rnd(c.length)];S.used[q.id]=1;return q;
}
function newRun(){
  S={lv:0,used:{},q:null,opts:[],end:0,start:Date.now(),cursed:4+rnd(4),shuffled:false,busy:true,msg:"",over:false,falls:0};
  loadLevel();
}
function loadLevel(){
  S.q=pickQ(S.lv);
  S.opts=shuffle([{t:S.q.a,ok:1},...S.q.w.map(t=>({t,ok:0}))]);
  S.end=Date.now()+T[S.lv]*1000;
  S.shuffled=false;S.busy=false;
}

/* ============ الشاشات ============ */
function flip(fn){
  const p=$("#page");p.classList.add("out");
  setTimeout(()=>{fn();p.classList.remove("out");p.classList.add("in");setTimeout(()=>p.classList.remove("in"),460);},420);
}
function cover(){
  clearInterval(tick);
  $("#page").innerHTML=SIGIL+'<h1>كتاب التحدي</h1><p class="sub">عشرة مستويات. الفخاخ كثيرة. والفائز واحد من كل مئة.</p>'+
  '<ul class="rules"><li>⏳ لكل مستوى وقت محدد، ولكل الرحلة <b>'+fmt(LIMIT)+'</b> دقائق.</li>'+
  '<li>❌ المستويات 1–5: كل خطأ يسرق منك '+PENALTY+' ثوانٍ.</li>'+
  '<li>🩸 المستويات 6–8: خطأ واحد يرجعك مستوى للوراء.</li>'+
  '<li>☠️ المستويان 9–10: خطأ واحد يرجعك مستويين.</li>'+
  '<li>👁 احذر الصفحات الملعونة، فقد تتبدل الخيارات أمام عينيك.</li>'+
  '<li>🎁 من أنهى الصفحات العشر في الوقت المحدد نال: '+REWARD_TEXT+'.</li></ul>'+
  '<button class="btn" id="go">افتح الكتاب 📖</button>'+
  '<div class="small">أفضل مستوى وصلت إليه: '+rec.best+' / 10 · انتصاراتك: '+rec.wins+'</div>';
  $("#go").onclick=()=>{newRun();flip(()=>{drawLevel();run();});};
}
function drawLevel(){
  const q=S.q,lv=S.lv;
  let dots="";for(let i=0;i<10;i++)dots+='<i class="'+(i<lv?"done":i===lv?"cur":"")+'"></i>';
  $("#page").innerHTML='<div class="top"><span class="lvl">المستوى '+(lv+1)+' / 10</span><span>الوقت الكلي <b class="mono" id="gt"></b></span></div>'+
   '<div class="dots">'+dots+'</div>'+
   '<div class="bar" id="bar"><b></b></div>'+
   (q.p===4?'<span class="tag">⚔️ معركة</span>':'')+
   '<div class="q">'+q.q+'</div><div id="opts"></div><div class="msg" id="msg">'+S.msg+'</div>';
  S.msg="";drawOpts();
}
function drawOpts(){
  $("#opts").innerHTML=S.opts.map((o,i)=>'<button class="opt'+(o.dead?" dead":"")+'" data-i="'+i+'">'+o.t+'</button>').join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function run(){
  clearInterval(tick);
  tick=setInterval(()=>{
    if(!S||S.over)return;
    const now=Date.now(),el=(now-S.start)/1000;
    const gt=$("#gt");if(gt)gt.textContent=fmt(Math.max(0,LIMIT-el));
    if(el>=LIMIT){return lose("انتهى الوقت الكلي للرحلة ⌛");}
    if(S.busy)return;
    const left=(S.end-now)/1000,bar=$("#bar");
    if(bar){bar.firstChild.style.width=Math.max(0,left/T[S.lv]*100)+"%";bar.classList.toggle("low",left<6);}
    if(S.lv===S.cursed&&!S.shuffled&&left<=8&&left>0){
      S.shuffled=true;S.opts=shuffle(S.opts);drawOpts();
      const m=$("#msg");if(m)m.textContent="👁 الصفحة ملعونة! الخيارات تبدّلت";
    }
    if(left<=0)fall("انتهى وقت المستوى ⏳");
  },100);
}
function answer(i){
  if(S.busy||S.over)return;
  const o=S.opts[i];
  if(o.ok){
    S.busy=true;
    if(S.lv===9)return win();
    flip(()=>{S.lv++;loadLevel();drawLevel();});
  } else if(S.lv<5){
    o.dead=true;S.end-=PENALTY*1000;
    const b=document.querySelectorAll(".opt")[i];if(b)b.classList.add("dead");
    const m=$("#msg");if(m)m.textContent="خطأ! خسرت "+PENALTY+" ثوانٍ";
  } else fall("إجابة خاطئة ❌");
}
function fall(why){
  if(S.busy)return;S.busy=true;S.falls++;
  const back=S.lv<5?(S.lv>0?1:0):S.lv<8?1:2;
  const nl=Math.max(0,S.lv-back);
  flip(()=>{S.msg=why+(back?" · عدت إلى المستوى "+(nl+1):" · أعد المحاولة");S.lv=nl;loadLevel();drawLevel();});
}
function record(){
  rec.best=Math.max(rec.best,S.lv+1>10?10:S.lv);store.set("toko_rec",rec);
}
function lose(why){
  if(!S||S.over)return;S.over=true;clearInterval(tick);record();
  const reached=S.lv+1;
  flip(()=>{$("#page").innerHTML=SIGIL+'<h2>أُغلق الكتاب 📕</h2><p class="sub">'+why+'<br>وصلت إلى المستوى '+reached+' من 10</p>'+
   '<div class="stats"><span><b>'+reached+'</b>أعلى مستوى</span><span><b>'+S.falls+'</b>مرات السقوط</span></div>'+
   '<button class="btn" id="again">حاول من جديد 🔁</button><div class="small">تتغير الصفحات والأسئلة عشوائياً في كل مرة.</div>';
   $("#again").onclick=()=>{newRun();flip(()=>{drawLevel();run();});};});
}
function win(){
  S.over=true;clearInterval(tick);
  const el=Math.floor((Date.now()-S.start)/1000);
  rec.wins++;rec.best=10;store.set("toko_rec",rec);
  const share="📖 أنهيت كتاب التحدي من tokonoma في "+fmt(el)+" 🏆\nهل تقدر؟ 👇\n"+SITE;
  flip(()=>{$("#page").innerHTML=SIGIL+'<h2>🏆 أتممت الكتاب!</h2><p class="sub">أنهيت الصفحات العشر في <b class="mono">'+fmt(el)+'</b></p>'+
   '<div style="text-align:center">'+REWARD_TEXT+'</div><span class="code">'+REWARD_CODE+'</span>'+
   '<div class="stats"><span><b>'+rec.wins+'</b>انتصاراتك</span><span><b>'+Math.max(0,10-rec.wins)+'</b>للمجسم المجاني</span></div>'+
   '<button class="btn" id="cp">نسخ النتيجة</button><a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">مشاركة على واتساب</a>'+
   '<button class="btn alt" id="again">كتاب جديد 🔁</button>'+
   '<div class="small">في هذه النسخة التجريبية الانتصارات محفوظة على جهازك فقط، وستُربط بحسابك قريباً.</div>';
   $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(share);$("#cp").textContent="تم النسخ ✅";}catch(e){prompt("انسخ:",share);}};
   $("#again").onclick=()=>{newRun();flip(()=>{drawLevel();run();});};});
}
cover();
</script>
</body>
</html>
